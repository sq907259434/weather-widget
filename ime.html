<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>输入桥</title>
<style>
  /* 这个窗口完全隐形：卡片是 Progman 的子窗口拿不到系统键盘焦点，
     打字由这里代收（真顶层窗口，输入法候选框也正常），再把文字
     实时镜像回卡片。窗口贴在搜索框的位置上，所以输入法候选
     会出现在正确的地方。 */
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
  }
  #k{
    width:100%; height:100%; border:0; outline:0; padding:0; margin:0;
    background:transparent; color:transparent; caret-color:transparent;
    font-size:13px; font-family:inherit;
  }
</style>
</head>
<body>
<input id="k" autocomplete="off" spellcheck="false">
<script>
const k = document.getElementById("k");
window.ime.onInit((v) => { k.value = String(v || ""); k.focus(); });
k.addEventListener("input", () => window.ime.text(k.value));
k.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); window.ime.commit(); }
  else if (e.key === "Escape") { e.preventDefault(); window.ime.cancel(); }
});
k.addEventListener("blur", () => {
  setTimeout(() => { if (document.activeElement !== k) window.ime.blur(); }, 0);
});
k.focus();
</script>
</body>
</html>
