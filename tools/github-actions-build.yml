# 自动打包脚本（备用，当前未启用）
#
# GitHub 对 .github/workflows/ 下的文件有额外权限要求：推送这类文件时，token 必须带
# 「workflow」scope，否则会直接被拒（refusing to allow an OAuth App to create or update workflow）。
# 本仓库首次上传时代码托管用的登录方式没有这个 scope，所以脚本先放在这里，功能一字未改。
#
# 想启用自动打包，任选一种：
#   1) 网页上新建：GitHub 仓库页 → Add file → Create new file → 文件名填
#      .github/workflows/build.yml → 把本文件内容粘进去 → Commit（网页方式不受 scope 限制）
#   2) 命令行走一遍：gh auth refresh -h github.com -s workflow  然后
#      mkdir -p .github/workflows && git mv tools/github-actions-build.yml .github/workflows/build.yml
#
# 启用后，推一个 v* 标签就会在 Actions 里自动打出安装版 + 绿色版，并发布到 Releases。

name: build

# 发布 Release 需要写权限。2023 年之后新建的仓库默认 GITHUB_TOKEN 是只读，
# 不显式声明的话 action-gh-release 会 403（"Resource not accessible by integration"）。
permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包（NSIS 安装版 + 绿色版）
        run: npx electron-builder --win
        env:
          # 没有签名证书，别让构建卡在自动查找证书上
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: weather-widget-win-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.exe

      - name: 打 tag 时自动发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable.exe
          generate_release_notes: true
